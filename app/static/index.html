<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Lead Scraping Engine</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        margin: 0;
        background: #111827;
        color: #e5e7eb;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      h1 {
        margin-top: 0;
        font-size: clamp(1.5rem, 2vw + 1rem, 2.2rem);
      }
      form {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      input,
      button {
        border-radius: 8px;
        border: 1px solid #374151;
        padding: 0.75rem;
        font-size: 1rem;
      }
      input {
        background: #1f2937;
        color: #e5e7eb;
      }
      button {
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      .meta {
        margin: 0 0 1rem;
        color: #9ca3af;
      }
      .grid {
        display: grid;
        gap: 0.75rem;
      }
      .card {
        border: 1px solid #374151;
        border-radius: 10px;
        padding: 1rem;
        background: #1f2937;
      }
      .card h3 {
        margin: 0 0 0.4rem;
      }
      .card p {
        margin: 0.4rem 0;
      }
      .empty {
        color: #9ca3af;
      }
      .error {
        color: #fca5a5;
      }
      @media (max-width: 700px) {
        form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Open Lead Scraping Engine</h1>
      <p class="meta">Search for likely business leads from Exa (or mock fallback).</p>

      <form id="scrape-form">
        <input id="query" name="query" required minlength="3" placeholder="Example: b2b dental clinics in texas" />
        <input id="limit" name="limit" type="number" min="1" max="20" value="5" />
        <button type="submit">Find leads</button>
      </form>

      <p id="status" class="meta">Enter a query to begin.</p>
      <section id="results" class="grid"></section>
    </main>

    <script>
      const form = document.getElementById("scrape-form");
      const queryInput = document.getElementById("query");
      const limitInput = document.getElementById("limit");
      const statusEl = document.getElementById("status");
      const resultsEl = document.getElementById("results");

      function renderLeads(leads) {
        resultsEl.innerHTML = "";
        if (!leads.length) {
          resultsEl.innerHTML = '<p class="empty">No leads returned.</p>';
          return;
        }

        leads.forEach((lead) => {
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <h3>${lead.name}</h3>
            <p>${lead.summary}</p>
            ${lead.website ? `<p><a href="${lead.website}" target="_blank" rel="noreferrer">${lead.website}</a></p>` : ""}
          `;
          resultsEl.appendChild(card);
        });
      }

      async function scrapeLeads(event) {
        event.preventDefault();
        const query = queryInput.value.trim();
        const limit = Number(limitInput.value);

        statusEl.textContent = "Searching...";
        statusEl.className = "meta";
        resultsEl.innerHTML = "";

        try {
          const response = await fetch("/api/leads/scrape", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, limit }),
          });

          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          const data = await response.json();
          statusEl.textContent = `Found ${data.leads.length} lead(s) using ${data.provider}.`;
          renderLeads(data.leads);
        } catch (error) {
          statusEl.textContent = String(error);
          statusEl.className = "error";
        }
      }

      form.addEventListener("submit", scrapeLeads);
    </script>
  </body>
</html>
